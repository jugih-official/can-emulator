<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 100 1100 460" width="1100" height="460" font-family="Helvetica, Arial, sans-serif">
<title>The bench: PC, Uno, MCP2515, module under test and the 12 V supply</title>
<desc>What is a wire and what comes over CAN when a VW MQB module runs on the bench with the Klemme 15 emulator.</desc>
<rect width="1180" height="640" fill="#ffffff"/>

<!-- PC -->
<rect x="60" y="150" width="150" height="100" rx="8" fill="#eef1f4" stroke="#8a9298" stroke-width="1.5"/>
<rect x="80" y="166" width="110" height="56" rx="3" fill="#3b4752"/>
<text x="135" y="198" font-size="10" fill="#cfe3ff" text-anchor="middle" font-family="monospace">115200 baud</text>
<text x="135" y="241" font-size="11" fill="#333" text-anchor="middle">PC: serial console</text>
<path d="M210,200 H292" stroke="#666" stroke-width="4" fill="none"/>
<text x="251" y="192" font-size="10" fill="#555" text-anchor="middle">USB</text>

<!-- Uno -->
<rect x="300" y="150" width="170" height="110" rx="5" fill="#1b8a9b" stroke="#0c6775" stroke-width="2"/>
<rect x="292" y="184" width="22" height="30" fill="#c3c9ce" stroke="#7a848c"/>
<rect x="330" y="154" width="130" height="8" fill="#1a1a1a"/>
<rect x="345" y="248" width="115" height="8" fill="#1a1a1a"/>
<text x="395" y="190" font-size="14" font-style="italic" font-weight="bold" fill="#fff" text-anchor="middle">Arduino Uno</text>
<circle cx="385" cy="252" r="3.5" fill="#d9b545"/>
<text x="392" y="275" font-size="9" fill="#333">GND pin</text>
<!-- the 16x2 LCD on A0..A5 -->
<rect x="60" y="285" width="200" height="48" rx="4" fill="#2e7d4f" stroke="#1f5e3a" stroke-width="1.5"/>
<rect x="70" y="293" width="180" height="32" rx="2" fill="#1a3a8a"/>
<text x="160" y="307" font-size="9" font-family="monospace" fill="#cfe3ff" text-anchor="middle" xml:space="preserve">KL15 ON    12.3V</text>
<text x="160" y="320" font-size="9" font-family="monospace" fill="#cfe3ff" text-anchor="middle" xml:space="preserve">■■■■ ◜          </text>
<path d="M260,309 H330 V260" stroke="#cfd4d8" stroke-width="6" fill="none"/>
<!-- SPI + power, seven wires -->
<rect x="470" y="188" width="30" height="34" fill="#cfd4d8"/>

<!-- MCP2515 module -->
<rect x="500" y="150" width="150" height="110" rx="5" fill="#2b5fb3" stroke="#1a3f7a" stroke-width="2"/>
<rect x="502" y="178" width="8" height="54" fill="#1a1a1a"/>
<text x="578" y="196" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">MCP2515 + TJA1050</text>
<text x="578" y="211" font-size="9" fill="#fff" text-anchor="middle">J1 on = one 120 Ω</text>
<rect x="640" y="192" width="22" height="40" fill="#2e8b57" stroke="#1f5e3a"/>
<text x="636" y="207" font-size="8" font-weight="bold" fill="#fff" text-anchor="end">H</text>
<text x="636" y="227" font-size="8" font-weight="bold" fill="#fff" text-anchor="end">L</text>

<!-- CAN pair -->
<path d="M662,204 H760 V240 H860" stroke="#e6b422" stroke-width="3" fill="none"/>
<path d="M662,224 H745 V262 H860" stroke="#2e9e4f" stroke-width="3" fill="none"/>
<!-- the optional far-end terminator -->

<!-- module under test -->
<rect x="860" y="120" width="260" height="190" rx="6" fill="#dfe3e8" stroke="#7a848c" stroke-width="1.5"/>
<text x="990" y="150" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Module under test</text>
<rect x="856" y="236" width="8" height="8" fill="#d9b545"/><text x="872" y="244" font-size="9" fill="#333">CAN H</text>
<rect x="856" y="258" width="8" height="8" fill="#d9b545"/><text x="872" y="266" font-size="9" fill="#333">CAN L</text>
<rect x="896" y="306" width="8" height="8" fill="#d9b545"/><text x="900" y="300" font-size="9" fill="#333" text-anchor="middle">Kl. 31</text>
<rect x="936" y="306" width="8" height="8" fill="#d9b545"/><text x="940" y="300" font-size="9" fill="#333" text-anchor="middle">Kl. 30</text>
<text x="892" y="330" font-size="9" fill="#555" text-anchor="end">ground</text>
<text x="948" y="330" font-size="9" fill="#555">+12 V</text>

<!-- PSU -->
<rect x="300" y="420" width="230" height="120" rx="6" fill="#eef1f4" stroke="#8a9298" stroke-width="1.5"/>
<text x="415" y="470" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Bench PSU</text>
<circle cx="470" cy="420" r="9" fill="#222"/><text x="470" y="424" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
<circle cx="510" cy="420" r="9" fill="#d62828"/><text x="510" y="424" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">+</text>

<!-- 12 V wires -->
<path d="M510,411 V390 H700 M740,390 H940 V314" stroke="#d62828" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="700" y="383" width="40" height="14" fill="#fff" stroke="#d62828" stroke-width="2"/>
<text x="720" y="413" font-size="10" fill="#333" text-anchor="middle">10–15 A fuse</text>
<path d="M470,411 V370 H900 V314" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round"/>
<path d="M470,370 H385 V256" stroke="#222" stroke-width="3" fill="none" stroke-linejoin="round"/>
<circle cx="470" cy="370" r="3.5" fill="#222"/>
</svg>
