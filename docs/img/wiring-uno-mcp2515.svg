<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 45 1100 890" width="1100" height="890" font-family="Helvetica, Arial, sans-serif">
<title>Arduino Uno R3 to MCP2515 module and 16x2 LCD, pin to pin</title>
<desc>Top view of the boards with every wire of the VW MQB Klemme 15 emulator: SPI, power, the ignition button and the 1602A display.</desc>
<rect width="1180" height="1060" fill="#ffffff"/>

