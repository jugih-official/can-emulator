<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 1200 400" width="1200" height="400" font-family="Helvetica, Arial, sans-serif">
<title>The bench around a J533 gateway</title>
<desc>Wiring of the bench: the Klemme 15 emulator on the convenience bus of a J533 gateway, the OBD socket on its diagnostic bus, a radio on the infotainment bus, and the 12 V supply.</desc>
<rect x="0" y="140" width="1200" height="400" fill="#ffffff"/>

<rect x="455" y="180" width="290" height="190" rx="6" fill="#2f3a44" stroke="#1b232a" stroke-width="1.5"/>
