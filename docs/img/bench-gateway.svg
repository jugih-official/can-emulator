<text x="735" y="319" font-size="10" fill="#fff" text-anchor="end">20</text><text x="735" y="333" font-size="10" fill="#fff" text-anchor="end">10</text>
<text x="813" y="307" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Infotainment</text>
<rect x="509" y="176" width="8" height="8" fill="#d9b545"/><rect x="523" y="176" width="8" height="8" fill="#d9b545"/>
<text x="513" y="197" font-size="10" fill="#fff" text-anchor="middle">16</text><text x="527" y="197" font-size="10" fill="#fff" text-anchor="middle">6</text>
