<text x="593" y="197" font-size="10" fill="#fff" text-anchor="middle">17</text><text x="607" y="197" font-size="10" fill="#fff" text-anchor="middle">7</text>
<text x="600" y="170" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Extended</text>
<rect x="669" y="176" width="8" height="8" fill="#d9b545"/><rect x="683" y="176" width="8" height="8" fill="#d9b545"/>
<text x="673" y="197" font-size="10" fill="#fff" text-anchor="middle">18</text><text x="687" y="197" font-size="10" fill="#fff" text-anchor="middle">8</text>
<text x="680" y="170" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Running gear</text>
