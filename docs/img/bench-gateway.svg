<text x="600" y="286" font-size="10" fill="#c9d3dc" text-anchor="middle">connector T20e</text>
<rect x="451" y="246" width="8" height="8" fill="#d9b545"/><rect x="451" y="260" width="8" height="8" fill="#d9b545"/>
<text x="465" y="254" font-size="10" fill="#fff" text-anchor="start">15</text><text x="465" y="268" font-size="10" fill="#fff" text-anchor="start">5</text>
